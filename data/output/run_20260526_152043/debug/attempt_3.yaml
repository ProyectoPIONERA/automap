prefixes:
  eli: "http://data.europa.eu/eli/ontology#"
  lkg: "http://example.org/lkg#"
  ex: "http://example.org/"
  schema: "http://schema.org/"
  foaf: "http://xmlns.com/foaf/0.1/"
  geo1: "http://www.w3.org/2003/01/geo/wgs84_pos#"
  dcterms: "http://purl.org/dc/terms/"
  rdf: "http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  rdfs: "http://www.w3.org/2000/01/rdf-schema#"
  xsd: "http://www.w3.org/2001/XMLSchema#"
  example: "http://example.com/"

mappings:
  CreditCardTransactionMapping:
    sources:
      - [data/input/kaggle/Credit_Fraud/fraudTest.csv~csv]
    s: example:CreditCardTransaction/$(trans_num)
    po:
      - [a, ex:CreditCardTransaction]
      - [schema:hasPart, $(cc_num), xsd:string]
      - [schema:merchant, $(merchant), xsd:string]
      - [ex:amount, $(amt), xsd:decimal]
      - [ex:isFraud, $(is_fraud), xsd:boolean]
      - [schema:cardholder, ex:Person/$(first)~iri]
      - [lkg:metadata, example:CreditCardTransaction/$(trans_num)/Metadata~iri]

  MerchantMapping:
    sources:
      - [data/input/kaggle/Credit_Fraud/fraudTest.csv~csv]
    s: example:Merchant/$(merchant)
    po:
      - [a, ex:Merchant]
      - [geo1:lat, $(merch_lat), xsd:float]
      - [geo1:long, $(merch_long), xsd:float]
      - [schema:merchant, $(merchant), xsd:string]
      - [eli:has_part, example:CreditCardTransaction/$(trans_num)~iri]

  MetadataMapping:
    sources:
      - [data/input/kaggle/Credit_Fraud/fraudTest.csv~csv]
    s: example:CreditCardTransaction/$(trans_num)/Metadata
    po:
      - [a, ex:CreditCardTransactionMetadata]
      - [schema:transactionDateTime, $(trans_date_trans_time), xsd:dateTime]
      - [schema:first, $(first), xsd:string]
      - [schema:last, $(last), xsd:string]
      - [schema:gender, $(gender), xsd:string]
      - [schema:street, $(street), xsd:string]
      - [schema:city, $(city), xsd:string]
      - [schema:state, $(state), xsd:string]
      - [schema:zip, $(zip), xsd:string]
      - [geo1:lat, $(lat), xsd:float]
      - [geo1:long, $(long), xsd:float]
      - [schema:cityPop, $(city_pop), xsd:integer]
      - [schema:job, $(job), xsd:string]
      - [schema:dob, $(dob), xsd:date]
